name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.99.1", "stable"]
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: >-
          cargo clippy --locked --workspace --all-targets --all-features --
          -D warnings
          -D clippy::all
          -D clippy::pedantic
          -D clippy::nursery
          -D clippy::cargo

  # Preserve the existing required status while gating every matrix entry.
  quality-gate:
    name: Quality
    if: ${{ always() }}
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Require all lint jobs to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success

  platform-smoke:
    name: Platform smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
          # Rust 1.99.1 runs on ARM64; cross-compile Intel using the macOS SDK.
          - name: macos-intel
            os: macos-15
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-smoke
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --all-features --target ${{ matrix.target }} --verbose

      - name: Verify Intel Mach-O architecture
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          binary=target/x86_64-apple-darwin/debug/rusthost-cli
          file "$binary"
          test "$(lipo -archs "$binary")" = x86_64
          otool -hv "$binary"

  # Legacy protected-branch status name; validates production compilation only.
  msrv:
    name: Tests
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Check minimum supported Rust
        run: cargo check --locked --workspace --all-features
